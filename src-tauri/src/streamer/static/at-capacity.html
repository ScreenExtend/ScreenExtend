<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ScreenExtend</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f8fafc;
        --card: #ffffff;
        --fg: #0f172a;
        --muted: #64748b;
        --line: #e2e8f0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #020617;
          --card: #0f172a;
          --fg: #e2e8f0;
          --muted: #94a3b8;
          --line: #1e293b;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .card {
        max-width: 30rem;
        width: 100%;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 28px;
      }
      h1 { margin: 0 0 10px; font-size: 1.35rem; }
      p { margin: 0 0 14px; color: var(--muted); }
      p.last { margin-bottom: 0; }
      .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #f59e0b;
        margin-right: 8px;
        vertical-align: 1px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1><span class="dot"></span>The display is already in use</h1>
      <p>
        Another device is using this Mac's extended display. This version of macOS can only drive one at a time.
      </p>
      <p class="last">
        Disconnect the other device to free it up, or use a Mac running macOS 10.15 Catalina or later, where ScreenExtend can create a display per device.
      </p>
    </div>
    <script>
      setInterval(function () {
        var x = new XMLHttpRequest();
        x.open("GET", "/", true);
        x.onload = function () {
          if (x.status === 200) location.reload();
        };
        x.send();
      }, 4000);
    </script>
  </body>
</html>
