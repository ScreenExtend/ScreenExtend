<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScreenExtend</title>
    <!-- NEVER add a <style> element to this file. Tauri rewrites the CSP of the page it
         serves, and an inline stylesheet makes it add a `'nonce-...'` to `style-src`; CSP
         then *ignores* the `'unsafe-inline'` this app's policy declares, and every
         stylesheet injected at runtime without that nonce is silently dropped. Monaco
         builds its entire theme that way -- 123 KB of `.mtk*` token colours, codicon
         glyphs and `--vscode-*` variables in one `<style class="monaco-colors">` -- so the
         config editor loses every colour, its gutter and its scrollbars while reporting no
         error anywhere. `node scripts/check-csp.mjs` fails the build if one comes back.
         The background below is therefore set from script (CSSOM writes are not subject to
         style-src) rather than from a rule. -->
    <script>
      (function () {
        // The two literal values of `--background` in src/index.css (`:root` and `.dark`).
        // The stylesheet that defines the token is render-blocking and 50 KB, so until it
        // arrives the window paints the WebView's default white canvas in both themes.
        // Only `html` is painted: `body` takes `bg-background` from the stylesheet and
        // covers the viewport, so this never competes with the token. Keep the two values
        // in step with src/index.css. No `color-scheme` -- that would also restyle the
        // native form controls.
        var LIGHT = "hsl(0 0% 100%)";
        var DARK = "hsl(222.2 84% 4.9%)";
        try {
          // The user's choice lives in tauri-plugin-store's config.json, which is read
          // asynchronously over IPC; `se-theme` is a synchronous paint hint written by
          // ThemeProvider, not a second source of truth. Without it a user on a dark OS
          // who picked light sees a dark frame until the store round-trips.
          var stored = null;
          try { stored = window.localStorage.getItem("se-theme"); } catch (e) {}
          var resolved =
            stored === "dark" || stored === "light"
              ? stored
              : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.classList.add(resolved);
          document.documentElement.style.background = resolved === "dark" ? DARK : LIGHT;
        } catch (e) {
          document.documentElement.classList.add("light");
          document.documentElement.style.background = LIGHT;
        }
      })();
    </script>
    <!-- Browser chrome the app has no use for. Each guard is scoped to what it is for;
         a document-wide preventDefault costs a real gesture somewhere else in a window
         that also hosts a full Monaco instance. `Element.closest` is Safari 9+. -->
    <script>
      (function () {
      var editable = ".monaco-editor, input, textarea, select, [contenteditable]";

      function within(node, selector) {
        if (!node || node.nodeType !== 1 || typeof node.closest !== "function") return false;
        return !!node.closest(selector);
      }

      // Text fields keep their menu: suppressing it everywhere took cut/copy/paste and
      // spellcheck off every input in the app and replaced them with nothing.
      document.addEventListener("contextmenu", function (event) {
        if (within(event.target, editable)) return;
        event.preventDefault();
      });

      // Only modified clicks on links: those are the ones a webview may answer by opening
      // a window the app cannot manage. Alt+click is Monaco's multi-cursor, Ctrl/Cmd+click
      // is add-cursor and go-to-definition, and Shift+click is range-extend for text and
      // list selection -- all of which the old document-wide guard swallowed.
      document.addEventListener("click", function (event) {
        if (!(event.ctrlKey || event.metaKey || event.shiftKey || event.altKey)) return;
        if (!within(event.target, "a[href]")) return;
        event.preventDefault();
      });

      // Reload throws away every piece of in-memory state (the router is a memory router)
      // and re-runs setup. `metaKey` matters most on macOS, whose WKWebView is the one
      // likeliest to honour Cmd+R.
      document.addEventListener("keydown", function (event) {
        var reload =
          event.key === "F5" ||
          ((event.ctrlKey || event.metaKey) && (event.key === "r" || event.key === "R"));
        if (reload) event.preventDefault();
      });

      // A file dropped on the window would otherwise navigate away from the app.
      document.addEventListener("dragover", function (event) { event.preventDefault(); });
      document.addEventListener("drop", function (event) { event.preventDefault(); });
      })();
    </script>
    <script>
      window.addEventListener("error", function (event) {
        var root = document.getElementById("root");
        if (!root || root.firstChild) return;
        var box = document.createElement("div");
        box.style.cssText = "font:14px/1.6 -apple-system,system-ui,sans-serif;color:#111;background:#fff;padding:48px;max-width:34em;margin:0 auto";
        var title = document.createElement("h1");
        title.style.cssText = "font-size:17px;margin:0 0 12px";
        title.appendChild(document.createTextNode("ScreenExtend could not start"));
        var body = document.createElement("p");
        body.style.cssText = "margin:0 0 16px";
        body.appendChild(document.createTextNode("The interface failed to load in the system WebKit. On macOS, install the latest updates available, Safari 13.1 or newer, through Software Update, then reopen ScreenExtend."));
        var detail = document.createElement("pre");
        detail.style.cssText = "white-space:pre-wrap;font:12px/1.5 ui-monospace,Menlo,monospace;color:#666;margin:0";
        detail.appendChild(document.createTextNode(String(event.message || event.error || "")));
        box.appendChild(title);
        box.appendChild(body);
        box.appendChild(detail);
        root.appendChild(box);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
