<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScreenExtend</title>
    <!-- The two literal values of `--background` in src/index.css (`:root` and `.dark`).
         They live here because the stylesheet that defines the token is render-blocking
         and 50 KB, so until it arrives the window paints the WebView's default white
         canvas in both themes. Only `html` is painted: `body` takes `bg-background` from
         the stylesheet and covers the viewport, so this never competes with the token.
         Keep the two values in step. No `color-scheme` declaration -- that would also
         restyle the native form controls. -->
    <style>
      html { background: hsl(0 0% 100%); }
      html.dark { background: hsl(222.2 84% 4.9%); }
    </style>
    <script>
      (function () {
        try {
          // The user's choice lives in tauri-plugin-store's config.json, which is read
          // asynchronously over IPC; `se-theme` is a synchronous paint hint written by
          // ThemeProvider, not a second source of truth. Without it a user on a dark OS
          // who picked light sees a dark frame until the store round-trips.
          var stored = null;
          try { stored = window.localStorage.getItem("se-theme"); } catch (e) {}
          var resolved =
            stored === "dark" || stored === "light"
              ? stored
              : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.classList.add(resolved);
        } catch (e) {
          document.documentElement.classList.add("light");
        }
      })();
    </script>
    <script>
      document.addEventListener("contextmenu", event => event.preventDefault());
      document.addEventListener("click", (event) => {
        if (event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) {
          event.preventDefault();
        }
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "F5" || (event.ctrlKey && event.key === "r")) {
          event.preventDefault();
        }
      });
      document.addEventListener("dragover", event => event.preventDefault());
      document.addEventListener("drop", event => event.preventDefault());
    </script>
    <script>
      window.addEventListener("error", function (event) {
        var root = document.getElementById("root");
        if (!root || root.firstChild) return;
        var box = document.createElement("div");
        box.style.cssText = "font:14px/1.6 -apple-system,system-ui,sans-serif;color:#111;background:#fff;padding:48px;max-width:34em;margin:0 auto";
        var title = document.createElement("h1");
        title.style.cssText = "font-size:17px;margin:0 0 12px";
        title.appendChild(document.createTextNode("ScreenExtend could not start"));
        var body = document.createElement("p");
        body.style.cssText = "margin:0 0 16px";
        body.appendChild(document.createTextNode("The interface failed to load in the system WebKit. On macOS, install the latest updates available, Safari 13.1 or newer, through Software Update, then reopen ScreenExtend."));
        var detail = document.createElement("pre");
        detail.style.cssText = "white-space:pre-wrap;font:12px/1.5 ui-monospace,Menlo,monospace;color:#666;margin:0";
        detail.appendChild(document.createTextNode(String(event.message || event.error || "")));
        box.appendChild(title);
        box.appendChild(body);
        box.appendChild(detail);
        root.appendChild(box);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
