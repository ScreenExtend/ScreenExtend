name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # incremental artifacts are useless in CI and bloat the rust-cache
  CARGO_INCREMENTAL: 0
  PNPM_VERSION: 10.26.1

jobs:
  # OS-independent checks, so once on ubuntu instead of per matrix OS
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # a lockfile that drops a native package's optionalDependencies still installs, but as a JS
      # shim with no binary: `pnpm tauri` dies at require() on a runner while the machine that
      # wrote the lockfile keeps working off its warm store. First, because every step needs it
      - name: lockfile carries the platform packages
        run: pnpm test:lockfile

      - name: eslint
        run: pnpm lint

      - name: tsc + vite build
        run: pnpm build

      - name: Safari 13.1 floor (dist/)
        run: node scripts/check-legacy-webkit.mjs

      # loads the shipped client .js in node:vm with browser stubs: no test runner, no devDependency
      - name: client page harnesses
        run: pnpm test:client

      # the gate's rules are pure functions over a CompatibilityReport, so they are testable
      # without a machine that lacks the capability
      - name: startup gate rules
        run: pnpm test:gate

      # two silent failures of the Settings config.json editor: a config key missing from the
      # schema (the editor rejects the user's own config), and an inline <style> in index.html,
      # which makes Tauri nonce style-src and voids the 'unsafe-inline' monaco's theme sheet needs.
      # After `pnpm build` so it can check dist/ too
      - name: config editor schema, masking and CSP
        run: pnpm test:config

      # bindings.ts is written by whichever debug binary last ran and carries `// @ts-nocheck`, so
      # a stale binary can revert the TS API surface with nothing failing until a runtime
      # "command not found". Static cross-check against the macro lists in lib.rs: needs no build
      - name: bindings.ts matches lib.rs
        run: node scripts/check-bindings.mjs

      - name: app version is the same in all four files
        run: node scripts/check-versions.mjs

  # `pnpm build` first: tauri_build embeds ../dist at compile time, so even `cargo check`
  # fails without it
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-13, macos-14, macos-15]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: build the frontend (tauri_build embeds it)
        run: pnpm build

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # includes the FFI layout tests (nvenc_layout, amd_layout, intel), the only thing asserting
      # those ABIs. No `--skip`: a test that cannot run here gates itself through
      # `test_support::skip`, which prints `SKIP <what>: <reason>` and fails under SE_REQUIRE_HW=1;
      # excluding it by name would hide it from the report
      - name: cargo test
        working-directory: src-tauri
        run: cargo test

  # the only machines where the 12.3+/13+/14.2+ paths can run (development is on 10.15).
  # macos-13 is Intel, macos-14 and macos-15 are Apple Silicon
  macos-smoke:
    name: macos smoke (${{ matrix.os }})
    needs: rust
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13, macos-14, macos-15]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: build the host binary
        working-directory: src-tauri
        run: cargo build --bin ScreenExtend

      # a hosted runner has no Screen Recording grant, so doctor exits 3 (DOCTOR_EXIT_PERMISSION):
      # assert on the report, not the exit code. Exit 1 (unsupported OS) is a real failure
      - name: doctor --json reports the probed backends
        working-directory: src-tauri
        run: |
          set -o pipefail
          code=0
          ./target/debug/ScreenExtend doctor --json > doctor.json || code=$?
          echo "doctor exit code: $code"
          cat doctor.json
          if [ "$code" = "1" ]; then
            echo "::error::doctor reports this macOS is unsupported"
            exit 1
          fi
          for field in '.os.name' '.os.version' '.os.supported' '.audioBackend' '.displayBackend'; do
            value=$(jq -r "$field" doctor.json)
            if [ -z "$value" ] || [ "$value" = "null" ]; then
              echo "::error::doctor --json is missing $field"
              exit 1
            fi
            echo "  $field = $value"
          done
          jq -e '.os.supported == true' doctor.json > /dev/null
          jq -r '"probes: \(.macos.probes | tojson)"' doctor.json

      - name: the probed audio tier matches the runner's macOS
        working-directory: src-tauri
        run: |
          backend=$(jq -r '.audioBackend' doctor.json)
          version=$(jq -r '.os.version' doctor.json)
          echo "macOS $version selected audio backend: $backend"
          # AudioBackend::as_str: process_tap (14.2+) > screencapturekit (13.0+) >
          # virtual_device (10.15-12.x, driver installed) > needs_driver_install > unsupported.
          case "${{ matrix.os }}" in
            macos-13) want=screencapturekit ;;
            macos-14|macos-15) want=process_tap ;;
          esac
          if [ "$backend" != "$want" ]; then
            echo "::error::expected the $want tier on ${{ matrix.os }}, probe returned '$backend'"
            exit 1
          fi
          echo "ok: $backend"

      # VideoToolbox compression of synthetic frames: no display and no screen-recording
      # grant needed, unlike the capture tests, which is why only the encoder module is run.
      # These are #[ignore]d because they need real hardware; a runner has it.
      - name: VideoToolbox encode (ignored tests)
        working-directory: src-tauri
        run: cargo test --lib macos_utils::streamer::encoder -- --ignored --nocapture

  # ---------------------------------------------------------------- dyld floor
  # One link-time reference to an API newer than 10.15 is bound by dyld before main(), so
  # the app does not launch on Catalina at all, and it launches fine on every machine that
  # could debug it. This is the gate for that.
  dyld-floor:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Release, because that is what ships and what dead-code elimination changes.
      - name: cargo build --release
        working-directory: src-tauri
        run: cargo build --release --bin ScreenExtend

      # ScreenCaptureKit.framework does not exist on 10.15, so an LC_LOAD_DYLIB for it is an
      # unconditional launch failure. This costs nothing and needs no SDK, so it runs first
      # and on its own.
      - name: no framework newer than the floor is linked
        working-directory: src-tauri
        run: |
          otool -L target/release/ScreenExtend | tee /tmp/otool-L.txt
          if grep -qE 'ScreenCaptureKit|Symbols\.framework|MediaExtension' /tmp/otool-L.txt; then
            echo "::error::the binary links a framework that is absent on macOS 10.15"
            exit 1
          fi

      - name: deployment target is the declared floor
        working-directory: src-tauri
        run: |
          otool -l target/release/ScreenExtend | grep -A4 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX' | tee /tmp/lc.txt
          want=$(jq -r '.bundle.macOS.minimumSystemVersion' tauri.macos.conf.json)
          # On an arm64 runner the slice legitimately records 11.0 (Apple Silicon postdates
          # 10.15), so accept the declared floor or 11.0, and nothing else.
          if ! grep -qE "(minos|version) (${want}|11\.0)" /tmp/lc.txt; then
            echo "::error::deployment target does not match minimumSystemVersion ${want}"
            exit 1
          fi

      # The 10.15 SDK is not on any hosted runner. Read scripts/check-macos-dyld.sh: the .tbd
      # stub index is the authoritative test and a newer SDK's stubs are a superset, so that
      # half weakens; the header INTRO column still fails anything introduced after --floor.
      # The strong verdict needs a run against the real 10.15 SDK.
      - name: dyld floor (runner SDK, --floor 10.15)
        run: |
          sdk=$(xcrun --sdk macosx --show-sdk-path)
          echo "checking against $sdk (SDK version $(xcrun --sdk macosx --show-sdk-version))"
          bash scripts/check-macos-dyld.sh \
            src-tauri/target/release/ScreenExtend "$sdk" --floor 10.15

      - name: upload the symbol report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dyld-floor-report
          path: |
            /tmp/otool-L.txt
            /tmp/lc.txt
          if-no-files-found: ignore

  # what both PROVENANCE.md files mean by "verified in CI". .gitattributes pins the blobs and
  # the SHA256SUMS files to the same bytes on every checkout
  blob-checksums:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: src-tauri/resources
        working-directory: src-tauri/resources
        run: sha256sum -c SHA256SUMS

      - name: src-tauri/binaries
        working-directory: src-tauri/binaries
        run: sha256sum -c SHA256SUMS

  # compares the encoder's printed timings against ci/perf-baseline.json. A runner key with no
  # committed baseline is reported, uploaded and passed (that file's readme block says how to
  # seed one). Hosted runners are shared VMs: seed from several runs, keep the tolerance loose.
  #
  # Windows measures x264, the only encoder present on every machine; macOS measures
  # VideoToolbox's per-submit cost (`vt_encode_p95=...us` from `encode_synthetic`). Neither
  # needs a display or a Screen Recording grant
  perf-gate:
    name: perf gate (${{ matrix.os }})
    needs: rust
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-13, macos-15]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # release: a debug encoder only measures the debug profile. Three runs and the gate takes
      # the lowest, the reading closest to the uncontended cost: the same binary measured
      # 4405 to 9067 us depending on what else the machine was doing
      - name: measure
        working-directory: src-tauri
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            measure="cargo test --release --lib macos_utils::streamer::encoder -- --ignored --nocapture"
          else
            measure="cargo test --release --lib x264_encoder -- --nocapture"
          fi
          echo "measuring with: $measure"
          for i in 1 2 3; do
            $measure | tee "../perf-run-$i.txt"
          done

      - name: compare against ci/perf-baseline.json
        shell: bash
        run: |
          node scripts/perf-gate.mjs \
            --key "ci-${{ matrix.os }}" \
            --input perf-run-1.txt --input perf-run-2.txt --input perf-run-3.txt \
            --out perf-observed-${{ matrix.os }}.json

      - name: upload the observed numbers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-observed-${{ matrix.os }}
          path: |
            perf-run-*.txt
            perf-observed-${{ matrix.os }}.json
          if-no-files-found: ignore
