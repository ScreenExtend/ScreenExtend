name: 'build'

on:
  push:
    tags:
      - 'app-v*'
  workflow_dispatch:

jobs:
  build-tauri:
    environment: 'Build Environment'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            args: '--target x86_64-pc-windows-msvc'
          - platform: 'macos-latest' # Universal (Apple Silicon + Intel)
            target: 'aarch64-apple-darwin,x86_64-apple-darwin'
            args: '--target universal-apple-darwin --config src-tauri/tauri.macos.conf.json --config src-tauri/tauri.macos.release.conf.json'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: install frontend dependencies
        run: pnpm install

      # The 10.15-12.x system-audio tier ships as a signed, notarized AudioServerPlugIn
      # package that `install_audio_driver` resolves out of the app bundle. It is gitignored,
      # so it has to be built here; without it the bundler copies nothing and the shipped app
      # offers an Install button that can only fail.
      #
      # Each credentialed step inside release.sh skips itself, loudly, when its identity is
      # absent -- so a fork without these secrets still produces an app, just one whose audio
      # package is unsigned and therefore refused by Gatekeeper on the user's machine.
      - name: build the macOS audio driver package
        if: matrix.platform == 'macos-latest'
        env:
          SE_SIGN_IDENTITY: ${{ secrets.SE_SIGN_IDENTITY }}
          SE_INSTALLER_IDENTITY: ${{ secrets.SE_INSTALLER_IDENTITY }}
          SE_NOTARY_PROFILE: ${{ secrets.SE_NOTARY_PROFILE }}
          SE_ARCHS: 'x86_64 arm64'
        run: |
          bash src-tauri/macos/ScreenExtendAudio/scripts/release.sh
          ls -l src-tauri/resources/ScreenExtendAudio.pkg

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # src-tauri/.cargo/config.toml already sets this for every cargo invocation; it is
          # repeated here so the value is visible to anyone reading the release job, and so a
          # C or Objective-C dependency compiled by a build script inherits it too. Without
          # it rustc's default for x86_64-apple-darwin is 10.12 and the shipped binary
          # contradicts minimumSystemVersion 10.15.
          MACOSX_DEPLOYMENT_TARGET: '10.15'
        with:
          tagName: app-v__VERSION__
          releaseName: 'ScreenExtend v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Everything below runs before `finalize-release`, which is what publishes the draft, so
      # a failure here leaves the release unpublished rather than shipping a broken bundle.

      # `src-tauri/Info.plist` reaches the bundle by a Tauri convention (a file of that exact
      # name beside the config is merged into the generated Contents/Info.plist) and, since
      # this change, by an explicit `bundle.macOS.infoPlist` too. Nothing asserted either, and
      # the failure mode is silent until it is fatal: a missing NSAudioCaptureUsageDescription
      # is a hard process kill the first time a user enables System Audio.
      #
      # NSSupportsAutomaticGraphicsSwitching is the same file's other load-bearing key: without
      # it a dual-GPU Mac pins the discrete GPU on for the app's whole lifetime (QA1734).
      - name: bundled Info.plist carries the keys the app cannot run without
        if: matrix.platform == 'macos-latest'
        run: |
          app=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos \
                     -maxdepth 1 -name 'ScreenExtend.app' | head -1)
          if [ -z "$app" ]; then echo "::error::no ScreenExtend.app was produced"; exit 1; fi
          plist="$app/Contents/Info.plist"
          for key in NSAudioCaptureUsageDescription NSAppTransportSecurity \
                     NSSupportsAutomaticGraphicsSwitching LSMinimumSystemVersion; do
            if ! /usr/libexec/PlistBuddy -c "Print :$key" "$plist" >/dev/null 2>&1; then
              echo "::error::$key is missing from the bundled Info.plist"
              exit 1
            fi
          done
          /usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$plist"
          if [ ! -f "$app/Contents/Resources/resources/ScreenExtendAudio.pkg" ]; then
            echo "::error::the audio driver package is not in the bundle; the 10.15-12.x \
                  system-audio tier would be unreachable in this release"
            exit 1
          fi

      # TCC keys a grant on (service, bundle id) plus a `csreq` blob captured at grant time, so
      # an identity that drifts between releases shows the user a ticked Screen Recording box
      # over a grant that no longer applies -- and on macOS 15 an ad-hoc identity reads as
      # denied however the user answered. The expected requirement is checked in beside the
      # resource provenance; see docs/manual-tests/macos-app-signing.md for how to re-seed it.
      #
      # Nothing in this workflow signs with a Developer ID until an APPLE_CERTIFICATE secret
      # exists, so without one the build is ad-hoc by construction: say so loudly and let the
      # release through rather than fail a gate no build can pass.
      - name: macOS code identity is stable and Developer ID
        if: matrix.platform == 'macos-latest'
        env:
          HAVE_DEVELOPER_ID: ${{ secrets.APPLE_CERTIFICATE != '' }}
        run: |
          app=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos \
                     -maxdepth 1 -name 'ScreenExtend.app' | head -1)
          codesign -dv --verbose=4 "$app" 2>&1 | tee /tmp/codesign.txt
          if [ "$HAVE_DEVELOPER_ID" != "true" ]; then
            echo "::warning::no APPLE_CERTIFICATE secret; this release is ad-hoc signed and \
                  TCC grants will not survive an update (docs/manual-tests/macos-app-signing.md)"
            exit 0
          fi
          if grep -qi 'Signature=adhoc' /tmp/codesign.txt; then
            echo "::error::the app is ad-hoc signed; TCC grants cannot survive a rebuild"
            exit 1
          fi
          if ! grep -q 'TeamIdentifier=' /tmp/codesign.txt \
             || grep -q 'TeamIdentifier=not set' /tmp/codesign.txt; then
            echo "::error::the app carries no Team ID"
            exit 1
          fi
          codesign -d -r- "$app" 2>&1 | sed -n 's/^designated => //p' > /tmp/dr.txt
          echo "designated requirement:"; cat /tmp/dr.txt
          expected=src-tauri/resources/EXPECTED_DESIGNATED_REQUIREMENT.txt
          if [ -s "$expected" ]; then
            if ! diff -u "$expected" /tmp/dr.txt; then
              echo "::error::the designated requirement changed; every existing TCC grant \
                    will stop matching. If this is intentional, update $expected."
              exit 1
            fi
          else
            echo "::warning::$expected is absent; seed it with the requirement printed                   above (docs/manual-tests/macos-app-signing.md) so the next release is gated"
          fi

      # The release is a draft until `finalize-release` publishes it, and that job needs this
      # one, so failing here leaves the draft unpublished. One link-time reference to an API
      # newer than 10.15 is bound by dyld before main(), which means the app does not launch
      # on Catalina at all while launching fine on this runner and on every modern dev Mac.
      #
      # The 10.15 SDK is not on any hosted runner: the .tbd stub half of the check therefore
      # weakens (a newer SDK's stubs are a superset), while the header-availability half
      # still fails anything annotated as introduced after the floor. The strong verdict is
      # the dev box run in docs/dev-workflow.md.
      - name: macOS dyld floor check (universal binary)
        if: matrix.platform == 'macos-latest'
        run: |
          bin=src-tauri/target/universal-apple-darwin/release/ScreenExtend
          lipo -info "$bin"
          otool -l "$bin" | grep -A4 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX'
          if otool -L "$bin" | grep -qE 'ScreenCaptureKit|Symbols\.framework|MediaExtension'; then
            echo "::error::the shipped binary links a framework that is absent on macOS 10.15"
            exit 1
          fi
          # nm -m -arch all covers both slices in one pass, so the arm64 half is audited too.
          bash scripts/check-macos-dyld.sh "$bin" "$(xcrun --sdk macosx --show-sdk-path)" --floor 10.15

  finalize-release:
    needs: build-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: read app version
        id: version
        run: echo "version=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

      - name: strip version from release asset filenames
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          release_id=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq ".[] | select(.tag_name == \"app-v${VERSION}\") | .id")
          if [ -z "$release_id" ]; then
            echo "::error::No release found for tag app-v${VERSION}"
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" \
            --jq '.[] | "\(.id) \(.name)"' | while read -r id name; do
            newname=${name//_${VERSION}_/_}
            if [ "$name" != "$newname" ]; then
              echo "Renaming $name -> $newname"
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/assets/${id}" -f name="$newname" >/dev/null
            fi
          done

      - name: sync updater manifest URLs with renamed assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tmp=$(mktemp -d)
          if ! gh release download "app-v${VERSION}" --pattern 'latest.json' --dir "$tmp"; then
            echo "::error::latest.json not found on release app-v${VERSION}"
            exit 1
          fi
          content=$(cat "$tmp/latest.json")
          content=${content//_${VERSION}_/_}
          printf '%s' "$content" > "$tmp/latest.json"
          gh release upload "app-v${VERSION}" "$tmp/latest.json" --clobber
          echo "Patched latest.json:"
          cat "$tmp/latest.json"

      - name: publish release and mark as latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release edit "app-v${VERSION}" --draft=false --latest

      - name: move 'latest' tag onto the released commit
        run: |
          git tag -f latest "${GITHUB_SHA}"
          git push -f origin latest
