name: 'build'

on:
  push:
    tags:
      - 'app-v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create and publish the GitHub release. Off: build only, the app and installers are attached to the run.'
        type: boolean
        default: true

jobs:
  build-tauri:
    environment: 'Build Environment'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            args: '--target x86_64-pc-windows-msvc'
          - platform: 'macos-latest' # Universal (Apple Silicon + Intel)
            target: 'aarch64-apple-darwin,x86_64-apple-darwin'
            args: '--target universal-apple-darwin --config src-tauri/tauri.macos.conf.json --config src-tauri/tauri.macos.release.conf.json'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: install frontend dependencies
        run: pnpm install

      # the audio driver .pkg (10.15-12.x system-audio tier) is gitignored, so build it here;
      # without it the app's Install button can only fail. release.sh skips signing and notarizing
      # when the secrets are absent: the .pkg is then unsigned and Gatekeeper refuses it
      - name: build the macOS audio driver package
        if: matrix.platform == 'macos-latest'
        env:
          SE_SIGN_IDENTITY: ${{ secrets.SE_SIGN_IDENTITY }}
          SE_INSTALLER_IDENTITY: ${{ secrets.SE_INSTALLER_IDENTITY }}
          SE_NOTARY_PROFILE: ${{ secrets.SE_NOTARY_PROFILE }}
          SE_ARCHS: 'x86_64 arm64'
        run: |
          bash src-tauri/macos/ScreenExtendAudio/scripts/release.sh
          ls -l src-tauri/resources/ScreenExtendAudio.pkg

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # also in src-tauri/.cargo/config.toml; repeated so C/ObjC built by build scripts inherit it.
          # rustc's default for x86_64-apple-darwin is 10.12, below minimumSystemVersion 10.15
          MACOSX_DEPLOYMENT_TARGET: '10.15'
        with:
          # no tag on a build-only run: the action then builds and uploads nothing to a release,
          # so a branch can be built without touching the published version
          tagName: ${{ (github.event_name == 'push' || inputs.publish) && 'app-v__VERSION__' || '' }}
          releaseName: 'ScreenExtend v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # the release-profile binary and its installers, on every run: a build-only run has no
      # release to carry them
      - name: attach the built app to the run
        uses: actions/upload-artifact@v4
        with:
          name: ScreenExtend-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            src-tauri/target/*/release/ScreenExtend.exe
            src-tauri/target/*/release/bundle/nsis/*.exe
            src-tauri/target/*/release/bundle/msi/*.msi
            src-tauri/target/*/release/bundle/dmg/*.dmg

      # the checks below gate finalize-release: a failure leaves the draft unpublished

      # the keys come from src-tauri/Info.plist, merged into the bundle by Tauri, and a miss is
      # silent until fatal: no NSAudioCaptureUsageDescription is a hard process kill the first time
      # System Audio is enabled, and without NSSupportsAutomaticGraphicsSwitching a dual-GPU Mac
      # keeps the discrete GPU on for the app's whole lifetime (QA1734)
      - name: bundled Info.plist carries the keys the app cannot run without
        if: matrix.platform == 'macos-latest'
        run: |
          app=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos \
                     -maxdepth 1 -name 'ScreenExtend.app' | head -1)
          if [ -z "$app" ]; then echo "::error::no ScreenExtend.app was produced"; exit 1; fi
          plist="$app/Contents/Info.plist"
          for key in NSAudioCaptureUsageDescription NSAppTransportSecurity \
                     NSSupportsAutomaticGraphicsSwitching LSMinimumSystemVersion; do
            if ! /usr/libexec/PlistBuddy -c "Print :$key" "$plist" >/dev/null 2>&1; then
              echo "::error::$key is missing from the bundled Info.plist"
              exit 1
            fi
          done
          /usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$plist"
          if [ ! -f "$app/Contents/Resources/resources/ScreenExtendAudio.pkg" ]; then
            echo "::error::the audio driver package is not in the bundle; the 10.15-12.x \
                  system-audio tier would be unreachable in this release"
            exit 1
          fi

      # with only the linker's ad-hoc signature (arm64 slice, Info.plist unbound, nothing sealed)
      # TCC stores grants against a csreq the app can never satisfy; signingIdentity "-" in
      # tauri.macos.conf.json makes the bundler sign both slices and the bundle. Require it whole:
      # --deep --strict, identifier == bundle id, Info.plist bound, resources sealed, and every
      # slice satisfying the designated requirement
      - name: macOS bundle signature is whole (every slice, Info.plist, resources)
        if: matrix.platform == 'macos-latest'
        run: |
          app=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos \
                     -maxdepth 1 -name 'ScreenExtend.app' | head -1)
          if [ -z "$app" ]; then echo "::error::no ScreenExtend.app was produced"; exit 1; fi
          lipo -archs "$app/Contents/MacOS/ScreenExtend"
          if ! bash scripts/check-macos-signature.sh "$app"; then
            echo "::error::the macOS bundle signature is incomplete; TCC grants could never match this build"
            exit 1
          fi
          # existing installs receive the updater archive, so check the copy inside it too
          tarball=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos \
                         -maxdepth 1 -name '*.app.tar.gz' | head -1)
          if [ -n "$tarball" ]; then
            tmp=$(mktemp -d)
            tar -xzf "$tarball" -C "$tmp"
            inner=$(find "$tmp" -maxdepth 2 -name '*.app' -type d | head -1)
            if [ -z "$inner" ]; then echo "::error::no .app inside $tarball"; exit 1; fi
            bash scripts/check-macos-signature.sh "$inner" || {
              echo "::error::the app inside $tarball is not whole-signed"; exit 1; }
          else
            echo "::warning::no .app.tar.gz updater archive was found to check"
          fi

      # TCC keys a grant on (service, bundle id) plus a csreq captured at grant time: if the
      # identity drifts between releases, Screen Recording shows ticked over a grant that no
      # longer applies. An ad-hoc requirement is the cdhashes, so its grants are lost on every
      # update, and without an APPLE_CERTIFICATE secret the build is ad-hoc by construction:
      # warn and pass
      - name: macOS code identity is stable and Developer ID
        if: matrix.platform == 'macos-latest'
        env:
          HAVE_DEVELOPER_ID: ${{ secrets.APPLE_CERTIFICATE != '' }}
        run: |
          app=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos \
                     -maxdepth 1 -name 'ScreenExtend.app' | head -1)
          codesign -dv --verbose=4 "$app" 2>&1 | tee /tmp/codesign.txt
          if [ "$HAVE_DEVELOPER_ID" != "true" ]; then
            echo "::warning::no APPLE_CERTIFICATE secret; this release is ad-hoc signed and \
                  TCC grants will not survive an update"
            exit 0
          fi
          if grep -qi 'Signature=adhoc' /tmp/codesign.txt; then
            echo "::error::the app is ad-hoc signed; TCC grants cannot survive a rebuild"
            exit 1
          fi
          if ! grep -q 'TeamIdentifier=' /tmp/codesign.txt \
             || grep -q 'TeamIdentifier=not set' /tmp/codesign.txt; then
            echo "::error::the app carries no Team ID"
            exit 1
          fi
          codesign -d -r- "$app" 2>&1 | sed -n 's/^designated => //p' > /tmp/dr.txt
          echo "designated requirement:"; cat /tmp/dr.txt
          expected=src-tauri/resources/EXPECTED_DESIGNATED_REQUIREMENT.txt
          if [ -s "$expected" ]; then
            if ! diff -u "$expected" /tmp/dr.txt; then
              echo "::error::the designated requirement changed; every existing TCC grant \
                    will stop matching. If this is intentional, update $expected."
              exit 1
            fi
          else
            echo "::warning::$expected is absent; seed it with the requirement printed                   above so the next release is gated"
          fi

      # one link-time reference to an API newer than 10.15 is bound by dyld before main(): the app
      # then fails to launch on Catalina while running fine here. No hosted runner has the 10.15
      # SDK, so the .tbd half of the check is weak (newer stubs are a superset); the
      # header-availability half still catches anything introduced after the floor
      - name: macOS dyld floor check (universal binary)
        if: matrix.platform == 'macos-latest'
        run: |
          bin=src-tauri/target/universal-apple-darwin/release/ScreenExtend
          lipo -info "$bin"
          otool -l "$bin" | grep -A4 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX'
          if otool -L "$bin" | grep -qE 'ScreenCaptureKit|Symbols\.framework|MediaExtension'; then
            echo "::error::the shipped binary links a framework that is absent on macOS 10.15"
            exit 1
          fi
          # nm -m -arch all covers both slices, so arm64 is checked too
          bash scripts/check-macos-dyld.sh "$bin" "$(xcrun --sdk macosx --show-sdk-path)" --floor 10.15

  finalize-release:
    needs: build-tauri
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: read app version
        id: version
        run: echo "version=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

      - name: strip version from release asset filenames
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          release_id=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq ".[] | select(.tag_name == \"app-v${VERSION}\") | .id")
          if [ -z "$release_id" ]; then
            echo "::error::No release found for tag app-v${VERSION}"
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" \
            --jq '.[] | "\(.id) \(.name)"' | while read -r id name; do
            newname=${name//_${VERSION}_/_}
            if [ "$name" != "$newname" ]; then
              echo "Renaming $name -> $newname"
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/assets/${id}" -f name="$newname" >/dev/null
            fi
          done

      - name: sync updater manifest URLs with renamed assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tmp=$(mktemp -d)
          if ! gh release download "app-v${VERSION}" --pattern 'latest.json' --dir "$tmp"; then
            echo "::error::latest.json not found on release app-v${VERSION}"
            exit 1
          fi
          content=$(cat "$tmp/latest.json")
          content=${content//_${VERSION}_/_}
          printf '%s' "$content" > "$tmp/latest.json"
          gh release upload "app-v${VERSION}" "$tmp/latest.json" --clobber
          echo "Patched latest.json:"
          cat "$tmp/latest.json"

      - name: publish release and mark as latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release edit "app-v${VERSION}" --draft=false --latest

      - name: move 'latest' tag onto the released commit
        run: |
          git tag -f latest "${GITHUB_SHA}"
          git push -f origin latest
